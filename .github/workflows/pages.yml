name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Enable automatic deploys with the repository variable PAGES_ENABLED=true.
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Set docs base
        env:
          DOCS_BASE_OVERRIDE: ${{ vars.DOCS_BASE }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          base="$DOCS_BASE_OVERRIDE"
          if [ -z "$base" ]; then
            if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
              base="/"
            else
              base="/$REPOSITORY_NAME/"
            fi
          fi
          case "$base" in
            /*) ;;
            *) base="/$base" ;;
          esac
          case "$base" in
            */) ;;
            *) base="$base/" ;;
          esac
          echo "DOCS_BASE=$base" >> "$GITHUB_ENV"

      - run: bun run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
