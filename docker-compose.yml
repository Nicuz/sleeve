services:
  sleeve:
    build:
      context: .
      args:
        SLEEVE_COMMIT: ${SLEEVE_COMMIT:-}
        SLEEVE_BUILD_DATE: ${SLEEVE_BUILD_DATE:-}
    image: sleeve:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-}
      SLEEVE_AUTH_USER: ${SLEEVE_AUTH_USER:-}
      SLEEVE_AUTH_PASSWORD: ${SLEEVE_AUTH_PASSWORD:-}
    volumes:
      - sleeve-data:/data

volumes:
  sleeve-data:
