# Source build. For the published image use docker-compose.image.yml.
services:
  sleeve:
    build:
      context: .
      args:
        SLEEVE_VERSION: ${SLEEVE_VERSION:-dev}
        SLEEVE_COMMIT: ${SLEEVE_COMMIT:-unknown}
        SLEEVE_BUILD_DATE: ${SLEEVE_BUILD_DATE:-}
    image: sleeve:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${SLEEVE_PORT:-3001}:3001"
    environment:
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-}
      SLEEVE_AUTH_USER: ${SLEEVE_AUTH_USER:-}
      SLEEVE_AUTH_PASSWORD: ${SLEEVE_AUTH_PASSWORD:-}
    volumes:
      - ${SLEEVE_DATA_DIR:-sleeve-data}:/data

volumes:
  sleeve-data:
